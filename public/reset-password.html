<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ECampus</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .hidden {
            display: none !important;
        }

        .msg-success {
            color: #16a34a;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 12px;
            background: #f0fdf4;
            border: 1px solid #86efac;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .msg-error {
            color: #dc2626;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            margin-top: 12px;
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 8px;
            padding: 10px 14px;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <div style="font-size:3rem; color:var(--primary); margin-bottom:1rem;">
                    <i class="fas fa-lock-open"></i>
                </div>
                <h1 id="pageTitle">Forgot Password?</h1>
                <p id="pageDesc" style="color:#64748b; margin-bottom:2rem;">Enter your email to receive a reset link.
                </p>
            </div>

            <!-- Request Reset Link -->
            <form id="requestForm" style="text-align:left;">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div style="position:relative;">
                        <i class="fas fa-envelope" style="position:absolute;left:15px;top:14px;color:#94a3b8;"></i>
                        <input type="email" id="resetEmail" class="form-input" placeholder="student@college.edu"
                            style="padding-left:45px;" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width:100%;justify-content:center;padding:1rem;font-size:1rem;">
                    <span id="reqBtnText">Send Reset Link</span>
                    <i id="reqLoader" class="fas fa-circle-notch fa-spin hidden" style="margin-left:10px;"></i>
                </button>
            </form>

            <!-- Set New Password -->
            <form id="newPassForm" class="hidden" style="text-align:left;">
                <input type="hidden" id="token">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div style="position:relative;">
                        <i class="fas fa-lock" style="position:absolute;left:15px;top:14px;color:#94a3b8;"></i>
                        <input type="password" id="newPassword" class="form-input" placeholder="Min. 6 characters"
                            style="padding-left:45px;" required minlength="6">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width:100%;justify-content:center;padding:1rem;font-size:1rem;background:linear-gradient(135deg,#16a34a,#15803d);">
                    <span id="newBtnText">Update Password</span>
                    <i id="newLoader" class="fas fa-circle-notch fa-spin hidden" style="margin-left:10px;"></i>
                </button>
            </form>

            <p id="msg" class="hidden"></p>

            <div class="auth-links" style="justify-content:center; margin-top:1.5rem;">
                <a href="index.html"><i class="fas fa-arrow-left" style="margin-right:6px;"></i>Back to Login</a>
            </div>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        const requestForm = document.getElementById('requestForm');
        const newPassForm = document.getElementById('newPassForm');
        const msg = document.getElementById('msg');

        if (resetToken) {
            document.title = 'Set New Password - ECampus';
            document.getElementById('pageTitle').innerText = 'Reset Password';
            document.getElementById('pageDesc').innerText = 'Enter your new secure password below.';
            requestForm.classList.add('hidden');
            newPassForm.classList.remove('hidden');
            document.getElementById('token').value = resetToken;
        }

        function showMsg(text, type) {
            msg.innerText = text;
            msg.className = type === 'success' ? 'msg-success' : 'msg-error';
            msg.classList.remove('hidden');
        }

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btnText = document.getElementById('reqBtnText');
            const loader = document.getElementById('reqLoader');
            btnText.innerText = 'Sending...';
            loader.classList.remove('hidden');
            msg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                showMsg(data.message || data.error || 'Something went wrong.', res.ok ? 'success' : 'error');
            } catch (err) {
                showMsg('Network error. Please check your connection.', 'error');
            } finally {
                btnText.innerText = 'Send Reset Link';
                loader.classList.add('hidden');
            }
        });

        newPassForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const tokenVal = document.getElementById('token').value;
            const btnText = document.getElementById('newBtnText');
            const loader = document.getElementById('newLoader');
            btnText.innerText = 'Updating...';
            loader.classList.remove('hidden');
            msg.classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenVal, newPassword })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg('Password updated! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    showMsg(data.error || data.message || 'Reset failed. Try again.', 'error');
                }
            } catch (err) {
                showMsg('Network error. Please check your connection.', 'error');
            } finally {
                btnText.innerText = 'Update Password';
                loader.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
