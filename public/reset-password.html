<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Placement Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-8">
        <h2 id="pageTitle" class="text-2xl font-bold text-gray-800 text-center mb-2">Forgot Password?</h2>
        <p id="pageDesc" class="text-center text-gray-500 mb-6">Enter your email to receive a reset link.</p>

        <form id="requestForm" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="resetEmail" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="student@college.edu" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition duration-300 flex justify-center items-center">
                <span id="reqBtnText">Send Reset Link</span>
                <span id="reqLoader" class="loader ml-2 hidden"></span>
            </button>
        </form>

        <form id="newPassForm" class="space-y-4 hidden">
            <input type="hidden" id="token">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">New Password</label>
                <input type="password" id="newPassword" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••" required>
            </div>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700 transition duration-300 flex justify-center items-center">
                <span id="newBtnText">Update Password</span>
                <span id="newLoader" class="loader ml-2 hidden"></span>
            </button>
        </form>

        <p id="msg" class="text-center text-sm mt-4 hidden"></p>
        
        <div class="text-center mt-6">
            <a href="index.html" class="text-blue-600 text-sm hover:underline">Back to Login</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        // Check if we are here to REQUEST a link or USE a link
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const requestForm = document.getElementById('requestForm');
        const newPassForm = document.getElementById('newPassForm');
        const pageTitle = document.getElementById('pageTitle');
        const pageDesc = document.getElementById('pageDesc');
        const msg = document.getElementById('msg');

        if (token) {
            // Mode: Set New Password
            document.title = "Set New Password";
            pageTitle.innerText = "Reset Password";
            pageDesc.innerText = "Enter your new secure password.";
            requestForm.classList.add('hidden');
            newPassForm.classList.remove('hidden');
            document.getElementById('token').value = token;
        }

        // --- Logic 1: Request Link ---
        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value;
            const btn = document.getElementById('reqBtnText');
            const loader = document.getElementById('reqLoader');

            btn.innerText = "Sending...";
            loader.classList.remove('hidden');
            msg.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                msg.innerText = data.message || data.error;
                msg.className = res.ok ? "text-center text-sm mt-4 text-green-600" : "text-center text-sm mt-4 text-red-500";
                msg.classList.remove('hidden');
            } catch (err) {
                alert("Network error");
            } finally {
                btn.innerText = "Send Reset Link";
                loader.classList.add('hidden');
            }
        });

        // --- Logic 2: Update Password ---
        newPassForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const tokenVal = document.getElementById('token').value;
            const btn = document.getElementById('newBtnText');
            const loader = document.getElementById('newLoader');

            btn.innerText = "Updating...";
            loader.classList.remove('hidden');
            msg.classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenVal, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    msg.innerText = "Success! Redirecting to login...";
                    msg.className = "text-center text-sm mt-4 text-green-600";
                    msg.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    msg.innerText = data.error;
                    msg.className = "text-center text-sm mt-4 text-red-500";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                alert("Network error");
            } finally {
                btn.innerText = "Update Password";
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
