<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Placement Tracker</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .hidden {
            display: none !important;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <div style="font-size: 3.5rem; margin-bottom: 1rem; position:relative; display:inline-block;">
                    <i class="fas fa-user-plus"
                        style="background:linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip:text; -webkit-text-fill-color:transparent;"></i>
                    <div
                        style="position:absolute; inset:0; background:radial-gradient(circle, rgba(79,70,229,0.15) 0%, transparent 70%); filter:blur(12px); z-index:-1;">
                    </div>
                </div>
                <h1>Create Account</h1>
                <p>Start your career journey with us.</p>
            </div>

            <form id="registerForm" style="text-align: left;">

                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div style="position: relative;">
                        <i class="fas fa-user" style="position: absolute; left: 15px; top: 14px; color: #94a3b8;"></i>
                        <input type="text" id="regName" class="form-input" placeholder="John Doe"
                            style="padding-left: 45px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div style="position: relative;">
                        <i class="fas fa-envelope"
                            style="position: absolute; left: 15px; top: 14px; color: #94a3b8;"></i>
                        <input type="email" id="regEmail" class="form-input" placeholder="student@college.edu"
                            style="padding-left: 45px;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div style="position: relative;">
                        <i class="fas fa-lock" style="position: absolute; left: 15px; top: 14px; color: #94a3b8;"></i>
                        <input type="password" id="regPassword" class="form-input" placeholder="Min 6 chars"
                            style="padding-left: 45px;" required>
                    </div>
                </div>

                <input type="hidden" id="regRole" value="student">

                <button type="submit" class="btn btn-primary"
                    style="width: 100%; justify-content: center; padding: 1rem; font-size: 1rem;">
                    <span id="regBtnText">Sign Up</span>
                    <i id="regLoader" class="fas fa-circle-notch fa-spin hidden" style="margin-left: 10px;"></i>
                </button>

                <p id="regErrorMsg" class="error-text hidden"></p>

            </form>

            <div class="auth-links" style="justify-content: center;">
                <span style="color: #64748b;">Already have an account? </span>
                <a href="index.html" style="margin-left: 5px;">Login here</a>
            </div>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
